<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹈鹕骑车 · 3D</title>
<style>
  :root{
    --ink:#2C2A26; --paper:#FFFDF7;
    --glass:rgba(255,253,247,.72); --line:rgba(60,52,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#E9DFC6;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  #c{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;left:20px;top:20px;z-index:10;
    display:flex;flex-direction:column;gap:10px;max-width:min(430px,calc(100vw - 40px));
    padding:16px 16px 14px;border-radius:18px;
    background:var(--glass);border:1px solid rgba(255,255,255,.65);
    box-shadow:0 10px 34px rgba(70,54,32,.16), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
    transition:opacity .35s, transform .35s;
  }
  #hud.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
  .brand{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
  .brand .t{font-size:17px;font-weight:800;letter-spacing:.03em;color:var(--ink)}
  .brand .s{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#9A917F;font-weight:600}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lbl{font-size:10.5px;letter-spacing:.1em;color:#9A917F;font-weight:700;
      text-transform:uppercase;width:100%;margin:4px 0 -2px}

  button{font:inherit;font-size:12px;color:#4A443A;cursor:pointer;
    padding:7px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.55);transition:all .16s ease;white-space:nowrap}
  button:hover{background:#fff;transform:translateY(-1px);border-color:rgba(60,52,40,.28)}
  button:active{transform:translateY(0)}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .sw{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 7px}
  .dots{display:flex}
  .dots i{width:12px;height:12px;border-radius:50%;display:block;margin-left:-3px;
          box-shadow:0 0 0 1.5px rgba(255,255,255,.95)}
  .dots i:first-child{margin-left:0}

  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
    background:linear-gradient(90deg,#CFC6B2,#B9AE98);outline:none;width:104px;margin:0 4px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.28);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--ink)}

  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;
    font-size:11.5px;letter-spacing:.06em;color:#6E6759;
    padding:7px 15px;border-radius:999px;background:rgba(255,253,247,.6);
    border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(10px);
    transition:opacity .8s ease;pointer-events:none}
  #hint.fade{opacity:0}

  #toggle{position:fixed;right:20px;top:20px;z-index:11;width:38px;height:38px;padding:0;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.65)}
  #toggle svg{width:17px;height:17px;stroke:#4A443A;fill:none;stroke-width:2;stroke-linecap:round}

  #loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#E9DFC6;color:#7A7263;font-size:13px;letter-spacing:.14em;
    transition:opacity .6s ease}
  #loading.gone{opacity:0;pointer-events:none}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(122,114,99,.25);
    border-top-color:#7A7263;animation:sp .8s linear infinite;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:560px){
    #hud{left:12px;top:12px;padding:12px;border-radius:15px;max-width:calc(100vw - 24px)}
    .brand .t{font-size:15px}
    input[type=range]{width:82px}
    #toggle{right:12px;top:12px}
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="loading"><span class="spin"></span>正在搭场景</div>

<div id="hud">
  <div class="brand"><span class="t">鹈鹕骑车</span><span class="s">pelican · 3d</span></div>
  <div class="lbl">配色</div>
  <div class="row" id="paletteRow"></div>
  <div class="lbl">镜头</div>
  <div class="row" id="camRow">
    <button data-cam="chase" class="on">跟拍</button>
    <button data-cam="side">正侧</button>
    <button data-cam="head">迎头</button>
    <button data-cam="low">贴地</button>
    <button data-cam="top">俯拍</button>
    <button id="cine">电影感 · 开</button>
  </div>
  <div class="lbl">速度</div>
  <div class="row">
    <input id="speed" type="range" min="0" max="2.6" step="0.04" value="1">
    <button id="play">暂停</button>
    <button id="lightbtn">车灯 · 自动</button>
    <button id="shot">截图</button>
  </div>
</div>

<button id="toggle" title="显示/隐藏面板">
  <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>

<div id="hint">拖拽旋转 · 滚轮缩放 · 空格暂停</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';

const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const atZ   = (v, z) => new V3(v.x, v.y, z);

/* ============================================================
   配色：每一套同时给出鸟、车、天、地
   ============================================================ */
const PALETTES = [
  { name:'晨光',
    wing:'#F1E8D7', body:'#FFFDF6', beak:'#F0A33C', pouch:'#F8C97B', tip:'#4A4640', leg:'#F2B155',
    frame:'#C94E3C', saddle:'#4B433A', tyre:'#2E3943', rim:'#CCD6DA',
    sky1:'#BFDCE8', sky2:'#E8F0E4', sky3:'#FBEFD4', sun:'#FFD79A',
    ground:'#E8D9B4', path:'#DCC79A', hill:'#A9C3B4', grass:'#8FAE7C', fog:'#E9E7D5' },

  { name:'黄昏',
    wing:'#EDE2CB', body:'#FBF4E4', beak:'#E08A3A', pouch:'#EFAF63', tip:'#453F3A', leg:'#DB9256',
    frame:'#7C63B0', saddle:'#4B433A', tyre:'#2E3943', rim:'#CCD6DA',
    sky1:'#8FA8C8', sky2:'#E6C9A8', sky3:'#F7D2A4', sun:'#FFC077',
    ground:'#D9BE94', path:'#C2A277', hill:'#8E9C92', grass:'#7E8D65', fog:'#DEC7A9' },

  { name:'薄荷',
    wing:'#ECEFE2', body:'#FCFEFB', beak:'#E9A23F', pouch:'#F4C87E', tip:'#3F4A46', leg:'#E5A063',
    frame:'#3E8F7C', saddle:'#43493F', tyre:'#2C3740', rim:'#CBD7D8',
    sky1:'#B7DDE0', sky2:'#DDF0E4', sky3:'#F3F4DE', sun:'#FFE0A6',
    ground:'#E2DDBE', path:'#CFC7A2', hill:'#9FC4B2', grass:'#84B08A', fog:'#DCE8DA' },

  { name:'沙丘',
    wing:'#EFE2C5', body:'#FCF2DC', beak:'#D9873A', pouch:'#EAB271', tip:'#4A423A', leg:'#D18F55',
    frame:'#2F5D8A', saddle:'#4A4238', tyre:'#2E3841', rim:'#CBD4D8',
    sky1:'#CBE0E6', sky2:'#F0E6D0', sky3:'#F9E9C6', sun:'#FFD48A',
    ground:'#E6CFA4', path:'#D6BA87', hill:'#C0B48E', grass:'#A3A473', fog:'#E8DCC0' },

  { name:'夜航',
    wing:'#CDC8B9', body:'#EAE6DA', beak:'#E59240', pouch:'#C9775A', tip:'#33383C', leg:'#C98A5E',
    frame:'#4FB9C9', saddle:'#2E3439', tyre:'#222A31', rim:'#8FA3AB',
    sky1:'#1D2A3A', sky2:'#3E4A57', sky3:'#8A7A63', sun:'#F2C079',
    ground:'#3A3F3C', path:'#4A4B42', hill:'#2B3A38', grass:'#3F4F42', fog:'#38424A' },
];

/* ============================================================
   渲染器 / 场景 / 相机
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xE9E7D5, 16, 62);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.35, 1.85, 3.15);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.92, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.5;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.497;
controls.enablePan = false;
controls.zoomSpeed = 0.8;
controls.rotateSpeed = 0.72;

/* ---- 环境反射：让白羽毛有层次，而不是一块死白 ---- */
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.55;

/* ---- 天空 ---- */
const skyUniforms = {
  cTop:{ value:new THREE.Color() }, cMid:{ value:new THREE.Color() }, cBot:{ value:new THREE.Color() },
  cSun:{ value:new THREE.Color() }, uSun:{ value:new V3(0.45, 0.62, -0.65).normalize() },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(90, 40, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false, uniforms: skyUniforms,
    vertexShader:`
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader:`
      uniform vec3 cTop, cMid, cBot, cSun, uSun;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 col = mix(cBot, cMid, smoothstep(0.40, 0.53, h));
        col = mix(col, cTop, smoothstep(0.53, 0.88, h));
        float s = max(dot(d, normalize(uSun)), 0.0);
        col += cSun * pow(s, 340.0) * 2.2;
        col += cSun * pow(s, 7.0) * 0.16;
        col += cSun * pow(s, 2.0) * 0.05;
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* ---- 光 ---- */
const sunDir = new V3(4.6, 6.4, 4.2);
const sun = new THREE.DirectionalLight(0xFFF2DC, 2.5);
sun.position.copy(sunDir);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 22;
sun.shadow.camera.left = -2.8;
sun.shadow.camera.right = 2.8;
sun.shadow.camera.top = 2.8;
sun.shadow.camera.bottom = -2.2;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.018;
sun.target.position.set(0, 0.85, 0);
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0xDCEEF5, 0xC8B48C, 0.85);
scene.add(hemi);

const rimLight = new THREE.DirectionalLight(0xFFE2B8, 0.85);
rimLight.position.set(-5, 3.2, -4);
scene.add(rimLight);

/* ============================================================
   材质表 —— 换配色时只改这些 color
   ============================================================ */
/* 轮胎花纹：沿轮圈方向重复的块状纹，只做 bump，不换颜色 */
function treadTexture() {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 64;
  const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 64);
  for (let i = 0; i < 4; i++) {
    g.fillStyle = i % 2 ? '#d0d0d0' : '#3a3a3a';
    g.fillRect(0, i * 16 + 2, 64, 12);
  }
  g.fillStyle = '#000000';                       // 中间的排水槽
  g.fillRect(0, 29, 64, 6);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(64, 1);
  t.anisotropy = 8;
  return t;
}
const treadTex = treadTexture();

const M = {
  body:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.62, metalness:0.0 }),
  wing:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.70, metalness:0.0 }),
  beak:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.46, metalness:0.0 }),
  pouch: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.52, metalness:0.0,
                                          side:THREE.DoubleSide }),
  tip:   new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.6 }),
  leg:   new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.55 }),
  legFar:new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.58 }),
  eye:   new THREE.MeshStandardMaterial({ color:0x241F1B, roughness:0.18, metalness:0.1 }),
  glint: new THREE.MeshBasicMaterial({ color:0xffffff }),
  // 车架：烤漆。清漆层是让它从"塑料块"变成"车"的关键
  frame: new THREE.MeshPhysicalMaterial({ color:0xffffff, roughness:0.36, metalness:0.10,
                                          clearcoat:1.0, clearcoatRoughness:0.10,
                                          reflectivity:0.5 }),
  saddle:new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.80, metalness:0.0 }),
  // 轮胎：胶质，靠 bump 出花纹
  tyre:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.95, metalness:0.0,
                                          bumpMap:treadTex, bumpScale:0.006 }),
  rim:   new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.22, metalness:0.90 }),
  metal: new THREE.MeshStandardMaterial({ color:0xB9C2C6, roughness:0.28, metalness:0.88 }),
  ground:new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.97 }),
  hill:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.95, flatShading:true }),
  grass: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.9, side:THREE.DoubleSide }),
  // ---- 体表羽列 / 喙细节 ----
  feather:new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.70 }),
  covert: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.72 }),
  wingDeep:new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.75 }),
  scarf: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.86, side:THREE.DoubleSide }),
  beakDark:new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.40 }),
  // ---- 车上的杂物 ----
  wood:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.88 }),
  fish:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.30, metalness:0.35 }),
  // ---- 景 ----
  tree:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.94, flatShading:true }),
  dune:  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.96, flatShading:true }),
  cloud: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1.0, fog:false }),
  water: new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.10, metalness:0.55 }),
  reflector: new THREE.MeshStandardMaterial({ color:0xD24A33, roughness:0.32,
                                              emissive:0x8E2416, emissiveIntensity:0.30 }),
};

/* ============================================================
   几何工具
   ============================================================ */
function rod(a, b, r, mat, seg = 12) {
  const dir = new V3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg, 1, false), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// 单位高、底面在原点、沿 +Y 生长的锥形骨，运行时只改 rotation / scale.y
function bone(rBase, rTip, mat, seg = 12) {
  const g = new THREE.CylinderGeometry(rTip, rBase, 1, seg, 1, false);
  g.translate(0, 0.5, 0);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function setBone(mesh, a, b) {
  const d = new V3().subVectors(b, a);
  const len = d.length() || 1e-5;
  mesh.position.copy(a);
  mesh.quaternion.setFromUnitVectors(UP, d.divideScalar(len));
  mesh.scale.set(1, len, 1);
}

// 沿曲线扫一个半径可变的管子；rFn(t) 返回数字或 [rx, rz]
function sweepGeo(curve, rFn, tubular = 48, radial = 16) {
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], idx = [];
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    const p = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    let r = rFn(t);
    const rx = Array.isArray(r) ? r[0] : r;
    const rz = Array.isArray(r) ? r[1] : r;
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
      pos.push(p.x + N.x*rx*c + B.x*rz*s,
               p.y + N.y*rx*c + B.y*rz*s,
               p.z + N.z*rx*c + B.z*rz*s);
    }
  }
  for (let i = 0; i < tubular; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

/* ============================================================
   自行车
   ============================================================ */
const R = 0.335;
const rearAxle  = new V3(-0.46, R, 0);
const frontAxle = new V3( 0.46, R, 0);
const bb        = new V3( 0.03, 0.285, 0);
const seatTop   = new V3(-0.20, 0.655, 0);
const headTop   = new V3( 0.355, 0.735, 0);
const headBot   = new V3( 0.415, 0.590, 0);
const stemTop   = new V3( 0.345, 0.845, 0);

const bike = new THREE.Group();
scene.add(bike);

/* --- 轮子 --- */
function makeWheel(axle, spokes = 18) {
  const g = new THREE.Group();
  g.position.copy(axle);

  const tyre = new THREE.Mesh(new THREE.TorusGeometry(R, 0.036, 14, 72), M.tyre);
  tyre.castShadow = true; tyre.receiveShadow = true;
  g.add(tyre);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(R - 0.052, 0.013, 8, 56), M.rim);
  rim.castShadow = true;
  g.add(rim);

  const spin = new THREE.Group();
  for (let i = 0; i < spokes; i++) {
    const a = (i / spokes) * Math.PI * 2;
    const inner = new V3(Math.cos(a) * 0.035, Math.sin(a) * 0.035, 0);
    const outer = new V3(Math.cos(a) * (R - 0.055), Math.sin(a) * (R - 0.055), 0);
    spin.add(rod(inner, outer, 0.0042, M.rim, 5));
  }
  g.add(spin);
  g.userData.spin = spin;

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.075, 14), M.metal);
  hub.rotation.x = Math.PI / 2;
  hub.castShadow = true;
  g.add(hub);

  // 辐条上的反光片，转起来好认
  const refl = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.028, 0.008), M.frame);
  refl.position.set(0, -(R - 0.14), 0.02);
  spin.add(refl);

  // 气门嘴：跟着轮子转，转起来才看得出在动
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.0055, 0.0055, 0.030, 8), M.metal);
  valve.position.set(0, R - 0.052, 0);
  spin.add(valve);
  const valveCap = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0075, 0.008, 8), M.frame);
  valveCap.position.set(0, R - 0.038, 0);
  spin.add(valveCap);

  // 花鼓两侧的轴帽
  for (const z of [0.040, -0.040]) {
    const ax = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.010, 10), M.metal);
    ax.rotation.x = Math.PI / 2;
    ax.position.set(0, 0, z);
    g.add(ax);
  }

  return g;
}
const wheelR = makeWheel(rearAxle);
const wheelF = makeWheel(frontAxle);
bike.add(wheelR, wheelF);

/* --- 车架 --- */
const frameTubes = [
  [seatTop, headTop, 0.021],          // 上管

function gearShape(rOut, rIn, teeth) {
  const s = new THREE.Shape();
  const N = teeth * 4;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = (i % 4 === 0 || i % 4 === 3) ? rOut : rIn;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath();
  const hole = new THREE.Path();
  hole.absarc(0, 0, 0.030, 0, Math.PI * 2, true);
  s.holes.push(hole);
  return s;
}

/* --- 身体：一个球直接揉出来，避免几个球相交留下接缝 --- */
function makeBodyGeo() {
  const g = new THREE.SphereGeometry(1, 52, 38);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = x * 0.5 + 0.5;                       // 0 = 尾端, 1 = 胸端
    const mid = Math.sin(Math.PI * t);             // 中段鼓起
    const wideZ = 0.84 + 0.30 * Math.pow(t, 1.3);  // 前宽后窄
    const wideY = 0.90 + 0.20 * mid;
    let nx = x * 0.345;
    let ny = y * 0.285 * wideY + 0.052 * (1 - y * y) * mid;  // 背拱起来
    let nz = z * 0.245 * wideZ;
    // 肚子压平一点，别是个球
    ny *= y < 0 ? 0.92 : 1.0;
    p.setXYZ(i, nx, ny, nz);
  }
  g.computeVertexNormals();
  return g;
}

/* 喉囊 —— 鹈鹕的招牌。
   不是压扁的球：袋口缝在下颌两侧，中段往外鼓、往下坠，到喙尖收成一点。
   每道剖面 = 从下颌一侧绕到另一侧；上缘宽度 a、最宽处 b、下垂深度 c 都随喙长变化。 */
/* 袋口贴着下喙的底面走：下喙是一根半径 0.026→0.007 的管子，
   它的底面就在中心线下面那么多，袋口必须咬在这条线上，不然袋子会陷进喙里。 */
const pouchCurve = new THREE.CatmullRomCurve3([
  new V3(0.075, -0.045, 0),
  new V3(0.250, -0.051, 0),
  new V3(0.430, -0.067, 0),
  new V3(0.588, -0.093, 0),
]);
const pBell  = u => Math.sin(Math.PI * Math.pow(clamp(u, 0, 1), 0.70));   // 0 → 1 → 0
const pTaper = u => (u > 0.10 ? 1 : 0.30 + 0.70 * (u / 0.10))            // 喉口收窄
                  * (u < 0.87 ? 1 : Math.sqrt(Math.max(0, (1 - u) / 0.13))); // 喙尖收口
const pAtt   = u => (0.046 - 0.034 * Math.pow(u, 0.8)) * pTaper(u);      // 缝在下颌上的半宽
const pWid   = u => (0.046 + 0.082 * pBell(u)) * pTaper(u);              // 袋最宽处（恒 ≥ pAtt）
const pSag   = u => (0.032 + 0.150 * pBell(u)) * pTaper(u);              // 往下坠多深

function pouchGeometry(nu = 48, nv = 26) {
  const pos = [], idx = [];
  for (let i = 0; i <= nu; i++) {
    const u = i / nu;
    const c = pouchCurve.getPointAt(u);
    const a = pAtt(u), b = pWid(u), sag = pSag(u);
    for (let j = 0; j <= nv; j++) {
      const phi = (j / nv) * Math.PI;          // 0 = +z 侧袋口, π = -z 侧袋口
      const co = Math.cos(phi), si = Math.sin(phi);
      // 袋面中段软软地收一道腰，出来一点布的褶
      const fold = 1 + 0.055 * Math.sin(phi * 2) * Math.sin(u * Math.PI);
      pos.push(
        c.x - 0.020 * si * si,                              // 袋底往后坐一点
        c.y - sag * Math.pow(si, 1.10) * fold,
        co * (a + (b - a) * Math.pow(si, 0.72)) * fold
      );
    }
  }
  for (let i = 0; i < nu; i++) {
    for (let j = 0; j < nv; j++) {
      const p0 = i * (nv + 1) + j, p1 = p0 + nv + 1;
      idx.push(p0, p1, p0 + 1, p1, p1 + 1, p0 + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

const pouch = new THREE.Mesh(pouchGeometry(), M.pouch);
pouch.castShadow = true; pouch.receiveShadow = true;
head.add(pouch);

// 袋口那道缝：沿下颌两侧各走一条细棱，把"袋"和"喙"分开
for (const s of [1, -1]) {
  const pts = [];
  for (let i = 0; i <= 26; i++) {
    const u = i / 26;
    const c = pouchCurve.getPointAt(u);
    pts.push(new V3(c.x, c.y + 0.003, s * pAtt(u) * 0.99));
  }
  const rim = new THREE.Mesh(
    sweepGeo(new THREE.CatmullRomCurve3(pts), () => 0.0044, 34, 8), M.beak
  );
  rim.castShadow = true;
  head.add(rim);
}

/* 眼睛 */
const eyes = [];
for (const z of [1, -1]) {
  // 眼周的裸皮圈：白鸟身上不画这一圈，眼睛就是一个孤零零的黑点
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.044, 0.0090, 8, 22), M.beak);
  ring.quaternion.setFromUnitVectors(new V3(0, 0, 1),
    new V3(0.30, 0.38, z * 0.87).normalize());
  ring.position.set(0.036, 0.048, z * 0.100);
  ring.castShadow = true;
  head.add(ring);

  // 眼球大半埋在颅骨里，只露出浅浅一层——露多了从背后看就是两个肉瘤
  const white = new THREE.Mesh(new THREE.SphereGeometry(0.038, 20, 16), M.body);
  white.position.set(0.038, 0.045, z * 0.085);
  head.add(white);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.020, 18, 14), M.eye);
  pupil.position.set(0.047, 0.056, z * 0.107);   // 瞳孔偏前，正面看才不是两颗侧挂的黑球
  head.add(pupil);
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.006, 10, 8), M.glint);
  glint.position.set(0.050, 0.066, z * 0.113);
  head.add(glint);
  eyes.push(white);
}

/* 翅膀：整块带厚度的翼板 + 分层覆羽，比一片纸更有体积 */
function wingShape(k) {
  const w = k, h = k;
  const s = new THREE.Shape();
  s.moveTo(0.055*w, 0.085*h);
  s.bezierCurveTo(-0.06*w, 0.180*h, -0.21*w, 0.170*h, -0.325*w, 0.098*h);
  s.bezierCurveTo(-0.400*w, 0.048*h, -0.440*w, -0.010*h, -0.452*w, -0.068*h);
  // 后下缘收成一条顺弧。锯齿缺口别做在翼板上——翼板是实体，缺口后面压着
  // 覆羽层，透出来的暗缝从侧面看就是一张长牙的嘴。羽边交给后面的飞羽排去长。
  s.bezierCurveTo(-0.330*w, -0.112*h, -0.190*w, -0.116*h, -0.090*w, -0.084*h);
  s.bezierCurveTo(-0.010*w, -0.058*h, 0.040*w, 0.020*h, 0.055*w, 0.085*h);
  return s;
}

function wingPlate(k, depth) {
  const g = new THREE.ExtrudeGeometry(wingShape(k), {
    depth, bevelEnabled: true,
    bevelThickness: depth * 0.42, bevelSize: 0.018,
    bevelSegments: 3, curveSegments: 18
  });
  g.translate(0, 0, -depth / 2);
  return g;
}

/* --- 让翼根贴住身体，而不是切进去 -------------------------------
   不靠猜椭球：直接朝身体打一束射线，量出这个高度上身体有多宽，
   比"身体半径"这种估计准，也不会因为身体被揉过而失准。 */
const zSurfAt = (() => {
  const probe = new THREE.Mesh(bodyMesh.geometry,
    new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
  probe.matrixAutoUpdate = false;
  bodyMesh.updateMatrix();
  probe.matrixWorld = bodyMesh.matrix;      // 身体在鸟的坐标里没有 y/z 旋转，横向就是 z

  const X0 = -0.66, X1 = 0.26, NX = 46;
  const Y0 = 0.78, Y1 = 1.38, NY = 38;
  const F = new Float32Array((NX + 1) * (NY + 1));
  const rc = new THREE.Raycaster();
  const o = new V3(), dir = new V3(0, 0, 1);
  rc.far = 2;
  for (let i = 0; i <= NX; i++) for (let j = 0; j <= NY; j++) {
    o.set(X0 + (X1 - X0) * i / NX, Y0 + (Y1 - Y0) * j / NY, 0);
    rc.set(o, dir);
    const hit = rc.intersectObject(probe, false);
    F[j * (NX + 1) + i] = hit.length ? hit[0].distance : 0;
  }
  const gx = u => clamp((u - X0) / (X1 - X0) * NX, 0, NX - 1e-6);
  const gy = v => clamp((v - Y0) / (Y1 - Y0) * NY, 0, NY - 1e-6);
  return (x, y) => {                        // 双线性取值
    const fx = gx(x), fy = gy(y);
    const i = Math.floor(fx), j = Math.floor(fy);
    const tx = fx - i, ty = fy - j;
    const a = F[j * (NX + 1) + i],     b = F[j * (NX + 1) + i + 1];
    const c = F[(j + 1) * (NX + 1) + i], d = F[(j + 1) * (NX + 1) + i + 1];
    if (a === 0 && b === 0 && c === 0 && d === 0) return 0;
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
})();

/* 让翼面贴着身体长，而不是一片立着的纸板。
   clearance = 留出的气隙；conform = 0 只管"别扎进去"，1 = 完全贴着体表走。
   贴体之后翼面会顺着身体的收放弯下去，翼尖也不会悬在半空。 */
function hugGeo(geo, pivot, clearance, conform = 0) {
  pivot.updateMatrix();
  const m = pivot.matrix;
  const inv = new THREE.Matrix4().copy(m).invert();
  const p = geo.attributes.position;
  const v = new V3();
  let moved = 0;
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(m);        // → 鸟的坐标
    const az = Math.abs(v.z);
    const need = zSurfAt(v.x, v.y) + clearance;
    // 身体在这里已经收没了（翼尖探到体外）：按同一比例往回收，别让它悬空
    const target = need < 0.02
      ? az * (1 - 0.78 * conform)
      : Math.max(need, az * (1 - conform) + need * conform);
    if (Math.abs(target - az) < 1e-4) continue;
    v.z = (v.z < 0 ? -1 : 1) * target;
    v.applyMatrix4(inv);
    p.setXYZ(i, v.x, v.y, v.z);
    moved++;
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return moved;
}

const wings = [];
for (const side of [1, -1]) {
  const pivot = new THREE.Group();
  pivot.position.set(0.005, 1.062, side * (side > 0 ? 0.186 : 0.168));
  pivot.rotation.z = 0.20;               // 翼尖朝后下方
  pivot.rotation.x = -side * 0.36;       // 上缘收进背脊，下缘张在身侧
  pivot.rotation.y = side * 0.06;

  // 两侧姿态不一样，几何得各做一份，贴身体的形变才不会错边
  const geoW = wingPlate(1.0, 0.060);
  hugGeo(geoW, pivot, 0.012, 0.48);       // conform 越小、离身体越远，翼才有厚度
  const w = new THREE.Mesh(geoW, M.wing);
  w.castShadow = true; w.receiveShadow = true;
  pivot.add(w);

  // 中覆羽：压成一条横带盖在翼的上半段，别做成同心圆——
  // 同心圆叠出来是贝壳，不是翅膀。下缘那一排初级飞羽的缺口得露在外面。
  const geoC = wingPlate(1.0, 0.044);
  geoC.scale(0.82, 0.58, 1);
  geoC.translate(-0.008, 0.046, side * 0.024);
  hugGeo(geoC, pivot, 0.030, 0.46);
  const cov = new THREE.Mesh(geoC, M.covert);
  cov.castShadow = true; cov.receiveShadow = true;
  pivot.add(cov);

  // 小覆羽：只盖肩头那一小块，把翼根和身体的接缝压住
  const geoD = wingPlate(1.0, 0.036);
  geoD.scale(0.46, 0.36, 1);
  geoD.translate(0.010, 0.078, side * 0.034);
  hugGeo(geoD, pivot, 0.044, 0.42);
  const cov2 = new THREE.Mesh(geoD, M.wingDeep);
  cov2.castShadow = true; cov2.receiveShadow = true;
  pivot.add(cov2);

  // 初级飞羽：六片顺着后下缘排开，越长越垂；最后两片换成黑羽
  // —— 翼缘的羽毛感必须来自一片片羽毛本身，不能靠翼板上的缺口硬锯出来。
  for (let i = 0; i < 6; i++) {
    const u = i / 5;
    const len = 0.150 + u * 0.092;
    const wid = 0.032 - u * 0.010;
    const ps = new THREE.Shape();
    ps.moveTo(0, 0);
    ps.quadraticCurveTo(-len * 0.60, wid, -len, wid * 0.16);
    ps.quadraticCurveTo(-len * 0.54, -wid * 0.72, 0, 0);
    const pg = new THREE.ExtrudeGeometry(ps, {
      depth: 0.009, bevelEnabled: true, bevelThickness: 0.003,
      bevelSize: 0.0035, bevelSegments: 1, curveSegments: 9 });
    pg.translate(0, 0, -0.0045);
    pg.rotateZ(-0.30 - u * 0.30);
    pg.translate(-0.044 - u * 0.256, -0.086 - u * 0.016, side * (0.004 + u * 0.004));
    hugGeo(pg, pivot, 0.046 + u * 0.006, 0.35);   // conform 低一点，翼尖那几片才不会往回缩
    const pm = new THREE.Mesh(pg, i >= 4 ? M.tip : M.wing);
    pm.castShadow = true; pm.receiveShadow = true;
    pivot.add(pm);
  }

  bird.add(pivot);
  wings.push(pivot);
}

/* ============================================================
   体表的羽列
   ------------------------------------------------------------
   身体原本是一个光溜溜的球。这里按身体网格的顶点往表面撒小羽片，
   羽尖朝后下方，一层压一层；全部合成一个 InstancedMesh，只有一次绘制。
   ============================================================ */
function featherShape(len, wid) {
  const s = new THREE.Shape();
  s.moveTo(0, len);                                        // 羽尖
  s.bezierCurveTo( wid, len * 0.40,  wid, -len * 0.34, 0, -len * 0.58);
  s.bezierCurveTo(-wid, -len * 0.34, -wid, len * 0.40, 0, len);
  return s;
}
const featherGeo = new THREE.ExtrudeGeometry(featherShape(0.040, 0.023), {
  depth: 0.005, bevelEnabled: true, bevelThickness: 0.0018,
  bevelSize: 0.0020, bevelSegments: 1, curveSegments: 6
});
featherGeo.translate(0, 0, -0.0025);

const FEATHER_DIR = new V3(-1, -0.45, 0).normalize();   // 默认：朝后下方

/* 摆一片羽：z 轴 = 表面法线，y 轴 = 羽尖方向（投到切平面上） */
function placeFeather(mats, p, n, scale, spin, dir) {
  const zA = n.clone().normalize();
  const yA = dir.clone().addScaledVector(zA, -dir.dot(zA));
  if (yA.lengthSq() < 1e-6) {                            // 方向正好顺着法线：换个与法线正交的
    yA.set(1, 0, 0).addScaledVector(zA, -zA.x);
    if (yA.lengthSq() < 1e-6) yA.set(0, 0, 1).addScaledVector(zA, -zA.z);
  }
  yA.normalize().applyAxisAngle(zA, spin);
  const xA = new V3().crossVectors(yA, zA).normalize();
  yA.crossVectors(zA, xA).normalize();
  const m = new THREE.Matrix4().makeBasis(
    xA.multiplyScalar(scale), yA.multiplyScalar(scale), zA);
  m.setPosition(p.x + zA.x * 0.0025, p.y + zA.y * 0.0025, p.z + zA.z * 0.0025);
  mats.push(m);
}

function featherMesh(mats, mat) {
  if (!mats.length) return null;
  const im = new THREE.InstancedMesh(featherGeo, mat, mats.length);
  mats.forEach((m, i) => im.setMatrixAt(i, m));
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  return im;
}

/* 按区域在身体表面撒羽，间距稀释保证不堆成一坨 */
function scatterBodyFeathers(region, spacing, scale) {
  bodyMesh.updateMatrix();
  const m = bodyMesh.matrix;
  const nm = new THREE.Matrix3().getNormalMatrix(m);
  const pos = bodyMesh.geometry.attributes.position;
  const nor = bodyMesh.geometry.attributes.normal;
  const p = new V3(), n = new V3();
  const kept = [], mats = [];
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i).applyMatrix4(m);
    if (!region(p)) continue;
    let ok = true;
    for (const q of kept) if (q.distanceToSquared(p) < spacing * spacing) { ok = false; break; }
    if (!ok) continue;
    kept.push(p.clone());
    n.fromBufferAttribute(nor, i).applyMatrix3(nm).normalize();
    placeFeather(mats, p, n, scale * (0.86 + Math.random() * 0.28),
                 (Math.random() - 0.5) * 0.7, FEATHER_DIR);
  }
  return featherMesh(mats, M.feather);
}

for (const g of [
  scatterBodyFeathers(p => p.x > -0.22 && p.x < 0.25 && p.y > 0.69 && p.y < 1.04, 0.033, 0.58),
  scatterBodyFeathers(p => p.x > -0.46 && p.x < -0.05 && p.y > 0.98 && p.y < 1.30, 0.036, 0.55)
]) if (g) bird.add(g);

/* --- 颈环：脖子根一圈翻出来的短羽，把"头插在球上"那道缝盖掉 --- */
{
  const mats = [];
  const DOWN = new V3(0, -1, 0);
  for (let ring = 0; ring < 2; ring++) {
    const t = 0.400 + ring * 0.100;      // 得在身体外面，太靠下就整圈埋进球里了
    const c = neckCurve.getPointAt(t);
    const tan = neckCurve.getTangentAt(t).normalize();
    const ref = Math.abs(tan.z) < 0.9 ? new V3(0, 0, 1) : new V3(1, 0, 0);
    const u = new V3().crossVectors(ref, tan).normalize();
    const v = new V3().crossVectors(tan, u).normalize();
    const r = lerp(0.104, 0.060, t) + 0.006;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2 + ring * 0.20;
      const out = new V3().addScaledVector(u, Math.cos(a)).addScaledVector(v, Math.sin(a)).normalize();
      placeFeather(mats, c.clone().addScaledVector(out, r), out,
                   1.75 * (0.88 + Math.random() * 0.26), (Math.random() - 0.5) * 0.5, DOWN);
    }
  }
  bird.add(featherMesh(mats, M.feather));
}

/* --- 围巾：脖子上系一圈，两条尾巴被风往后掀 ----------------
   它给这只鸟一个"出门赶集"的身份，也把颈和身体那道接缝收干净。 */
const scarfTailG = new THREE.Group();
{
  const t = 0.68;
  const c = neckCurve.getPointAt(t);
  const nt = neckCurve.getTangentAt(t).normalize();
  const rNeck = lerp(0.104, 0.060, t);

  const band = new THREE.Mesh(new THREE.TorusGeometry(rNeck + 0.008, 0.017, 8, 26), M.scarf);
  band.quaternion.setFromUnitVectors(new V3(0, 0, 1), nt);
  band.position.copy(c).addScaledVector(nt, -0.004);
  band.castShadow = true;
  bird.add(band);

  // 打结处
  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 10), M.scarf);
  knot.position.copy(c).add(new V3(-0.004, -0.004, rNeck + 0.012));
  knot.scale.set(1.0, 1.0, 0.7);
  knot.castShadow = true;
  bird.add(knot);

  scarfTailG.position.copy(c).add(new V3(-0.006, -0.004, rNeck + 0.012));
  for (const [zz, ph] of [[0.010, 0], [-0.016, 1]]) {
    const curve = new THREE.CatmullRomCurve3([
      new V3(0, 0, zz),
      new V3(-0.080, -0.012, zz + 0.020 * ph),
      new V3(-0.175, -0.048, zz + 0.055 * ph),
      new V3(-0.265, -0.105, zz + 0.095 * ph),
    ]);
    const tail = new THREE.Mesh(
      sweepGeo(curve, u => [0.0060 * (1 - u * 0.25), 0.026 * (1 - u * 0.55)], 24, 10),
      M.scarf);
    tail.castShadow = true;
    scarfTailG.add(tail);
  }
  bird.add(scarfTailG);
}

/* --- 脑后一小撮冠羽 --- */
for (let i = 0; i < 5; i++) {
  const zz = (i - 2) * 0.028;
  const f = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.105, 5), M.covert);
  f.position.set(-0.116, 0.074 - Math.abs(zz) * 0.45, zz);
  f.rotation.set(zz * 6.0, 0, 1.30);                    // 朝后上方翘
  f.castShadow = true;
  head.add(f);
}

/* --- 喙上的细节：上喙脊、鼻孔、喙尖的甲 --- */
{
  const ridgePts = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14;
    const c = beakCurve.getPointAt(t);
    ridgePts.push(new V3(c.x, c.y + lerp(0.030, 0.008, t) * 0.82, 0));
  }
  const ridge = new THREE.Mesh(
    sweepGeo(new THREE.CatmullRomCurve3(ridgePts), t => lerp(0.0075, 0.0024, t), 30, 8),
    M.beakDark);
  ridge.castShadow = true;
  head.add(ridge);

  for (const z of [1, -1]) {                            // 鼻孔：两道压扁的暗缝
    const no = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), M.beakDark);
    no.scale.set(0.016, 0.0045, 0.0085);
    no.position.set(0.172, 0.040, z * 0.019);
    no.rotation.y = z * 0.25;
    head.add(no);
  }

  const nail = new THREE.Mesh(new THREE.ConeGeometry(0.0135, 0.038, 10), M.beakDark);
  nail.position.set(0.594, -0.060, 0);
  nail.rotation.z = Math.PI * 0.93;
  nail.scale.z = 0.55;                                  // 压扁一点，别是个圆锥
  nail.castShadow = true;
  head.add(nail);
}

/* 尾羽：一片带缺口的尾板，翘起来 */
const tailShape = new THREE.Shape();
tailShape.moveTo(0.030, 0.052);
tailShape.bezierCurveTo(-0.06, 0.062, -0.16, 0.060, -0.245, 0.052);
const tailNotch = [
  [-0.272, 0.046], [-0.284, 0.022],

const L1 = 0.320, L2 = 0.325;

function ik2(hip, foot, l1, l2, bend) {
  let dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy) || 1e-5;
  const dmax = l1 + l2 - 1e-4;
  if (d > dmax) { dx *= dmax / d; dy *= dmax / d; d = dmax; }
  const a = (l1*l1 - l2*l2 + d*d) / (2*d);
  const h = Math.sqrt(Math.max(0, l1*l1 - a*a));
  const ux = dx/d, uy = dy/d;
  return new V3(
    hip.x + ux*a + (-uy)*bend*h,
    hip.y + uy*a + ( ux)*bend*h,
    hip.z
  );
}

/* 沿曲线摊一条带子出来：路面、路肩都用它 */
function ribbonGeo(curve, width, segs, y, uRep) {
  const pos = [], uv = [], idx = [];
  const p = new V3(), tan = new V3(), s = new V3();
  for (let i = 0; i <= segs; i++) {
    const u = i / segs;
    curve.getPointAt(u, p);
    curve.getTangentAt(u, tan);
    s.crossVectors(tan, UP).normalize();
    const h = width / 2;
    pos.push(p.x - s.x * h, y, p.z - s.z * h);
    pos.push(p.x + s.x * h, y, p.z + s.z * h);
    uv.push(u * uRep, 0, u * uRep, 1);
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}

const trackSamples = [];
for (let i = 0; i < 140; i++) trackSamples.push(track.getPointAt(i / 140).clone());
function clearOfTrack(x, z, d) {
  for (const p of trackSamples) {
    const dx = p.x - x, dz = p.z - z;
    if (dx * dx + dz * dz < d * d) return false;
  }
  return true;
}
function scatterFar(count, rMin, rMax, gap) {
  const out = [];
  for (let i = 0; i < count; i++) {
    for (let tries = 0; tries < 40; tries++) {
      const a = Math.random() * Math.PI * 2;
      const r = rMin + Math.random() * (rMax - rMin);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (!clearOfTrack(x, z, gap)) continue;
      out.push([x, z]);
      break;
    }
  }
  return out;
}

/* 车头灯：灯壳 + 灯面 + 一束聚光 */
{

/* ============================================================
   配色应用
   ============================================================ */
let curPalette = null;
let lightMode = 0;                       // 0 自动 / 1 常开 / 2 常闭
function isNight() { return curPalette && curPalette.name === '夜航'; }
function refreshLights() {
  const on = lightMode === 1 ? true : lightMode === 2 ? false : isNight();
  headlight.intensity = on ? 46 : 0;
  tailLight.intensity = on ? 0.75 : 0;
  lampMat.emissiveIntensity = on ? 3.2 : 0;
  tailMat.emissiveIntensity = on ? 2.6 : 0;
  const btn = document.getElementById('lightbtn');
  if (btn) btn.textContent = '车灯 · ' + ['自动', '常开', '常闭'][lightMode];
}

function applyPalette(p) {
  M.body.color.set(p.body);
  // 翼板别比身体深太多：一块奶黄色的椭圆贴在白球上，看久了就是个贝壳
  M.wing.color.set(p.wing).lerp(new THREE.Color(p.body), 0.45);
  M.beak.color.set(p.beak);
  M.pouch.color.set(p.pouch);
  M.tip.color.set(p.tip);
  M.leg.color.set(p.leg);
  M.legFar.color.set(p.leg).multiplyScalar(0.82);
  M.frame.color.set(p.frame);
  M.saddle.color.set(p.saddle);
  M.tyre.color.set(p.tyre);
  M.rim.color.set(p.rim);
  M.ground.color.set(p.ground);
  M.hill.color.set(p.hill);
  M.grass.color.set(p.grass);

  // 新加元素的颜色全部从已有色派生，加一套配色不用再改五份表
  M.feather.color.copy(M.body.color).multiplyScalar(0.945);
  M.covert.color.copy(M.wing.color).multiplyScalar(0.87);
  M.wingDeep.color.copy(M.wing.color).multiplyScalar(0.73);
  M.scarf.color.copy(M.frame.color).lerp(new THREE.Color(p.beak), 0.12);
  M.beakDark.color.set(p.beak).multiplyScalar(0.76);
  M.wood.color.set(p.saddle).lerp(new THREE.Color(p.beak), 0.30).multiplyScalar(1.05);
  M.fish.color.set(p.rim).lerp(new THREE.Color(p.sky1), 0.34);
  M.tree.color.set(p.saddle).multiplyScalar(0.70);
  M.dune.color.set(p.ground).lerp(new THREE.Color(p.hill), 0.30);
  M.cloud.color.set(p.body).lerp(new THREE.Color(p.fog), 0.12);
  M.water.color.set(p.sky1).lerp(new THREE.Color(p.sky2), 0.30);
  if (p.name === '夜航') {                                     // 夜里云和水都不能自己发光
    M.cloud.color.multiplyScalar(0.42);
    M.water.color.set(p.sky1).multiplyScalar(0.75);
  }

  pathMat.color.set(p.path);
  dashMat.color.set(p.name === '夜航' ? '#B9A98A' : '#FFF7E4');

  skyUniforms.cTop.value.set(p.sky1);
  skyUniforms.cMid.value.set(p.sky2);
  skyUniforms.cBot.value.set(p.sky3);
  skyUniforms.cSun.value.set(p.sun);

  scene.fog.color.set(p.fog);
  scene.background = null;
  renderer.setClearColor(new THREE.Color(p.fog), 1);

  const night = p.name === '夜航';
  sun.intensity = night ? 0.9 : 2.5;
  hemi.intensity = night ? 0.42 : 0.85;
  rimLight.intensity = night ? 1.5 : 0.85;
  scene.environmentIntensity = night ? 0.22 : 0.55;

  curPalette = p;
  refreshLights();
}

/* ---- 电影镜头：机位全部相对"整车"定义，车跑到哪儿镜头跟到哪儿 ----
   车的正前方是局部 +x，所以 -x 是车后、+x 是车头。 */
const SHOTS = {
  chase: { off: [-3.45, 1.62, 2.05], look: [0.62, 0.96, 0.02], dur: 7.0 },
  side:  { off: [ 0.18, 1.16, 4.30], look: [0.02, 0.94, 0.00], dur: 6.2 },
  head:  { off: [ 4.55, 1.28, -0.95], look: [0.05, 0.98, 0.00], dur: 5.6 },
  low:   { off: [ 2.95, 0.40, 1.62], look: [0.28, 0.90, 0.00], dur: 6.0 },
  top:   { off: [-1.85, 3.25, 2.50], look: [0.18, 0.84, 0.00], dur: 6.4 },
};
const SHOT_ORDER = ['chase', 'side', 'low', 'head', 'top'];
let shotKey = 'chase';
let shotT = 0;
let cine = true;

const camTweenBtn = document.getElementById('cine');
camTweenBtn.onclick = () => {
  cine = !cine;
  camTweenBtn.textContent = '电影感 · ' + (cine ? '开' : '关');
  camTweenBtn.classList.toggle('on', cine);
  controls.enabled = !cine;              // 交给电影运镜时别让鼠标抢镜头
  if (!cine) {                           // 退出时把当前视角交给轨道控制
    controls.target.set(rig.position.x, 0.95, rig.position.z);
    controls.update();
  }
};
camTweenBtn.classList.add('on');
controls.enabled = false;                // 默认交给电影运镜

document.querySelectorAll('#camRow button[data-cam]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#camRow button[data-cam]').forEach(x => x.classList.remove('on'));
    btn.classList.add('on');
    shotKey = btn.dataset.cam;
    shotT = 0;
    if (!cine) {                          // 手动模式下点了机位就回到电影运镜
      cine = true;
      camTweenBtn.textContent = '电影感 · 开';
      camTweenBtn.classList.add('on');
      controls.enabled = false;
    }
  };
});

/* 速度 / 暂停 / 截图 */
const speedEl = document.getElementById('speed');
const playBtn = document.getElementById('play');
let speed = 1, playing = true;
speedEl.oninput = () => { speed = parseFloat(speedEl.value); };
playBtn.onclick = () => {

document.getElementById('lightbtn').onclick = () => {

};

/* ============================================================
   动画
   ============================================================ */
const clock = new THREE.Timer();
let crankAngle = 0;
let blinkT = 2.2;

/* 赛道上的位置与朝向 */
let trackT = 0.12;
let lean = 0;
const _tp = new V3(), _tt = new V3(), _tt2 = new V3();
const _yawQ = new THREE.Quaternion();
const _off = [0, 0, 0], _lk = [0, 0, 0];
const _smOff = [-3.45, 1.62, 2.05], _smLk = [0.62, 0.96, 0.02];   // 起手就是跟拍位
const _tmpV = new V3();

const pedalNear = new V3();
const pedalFar  = new V3();
const kneeV = new V3();

const _hipW = new V3(), _pedW = new V3();
// 腿挂在 bird 组里，所以踏板坐标要先换到 bird 的局部空间，脚才踩得准
function updateLeg(leg, pedalScene) {
  _hipW.set(HIP.x, HIP.y, leg.userData.z);
  _pedW.set(pedalScene.x - bird.position.x,
            pedalScene.y - bird.position.y,
            leg.userData.z);
  const knee = ik2(_hipW, _pedW, L1, L2, 1);
  setBone(leg.userData.thigh, _hipW, knee);
  setBone(leg.userData.shin, knee, _pedW);
  leg.userData.knee.position.copy(knee);
  leg.userData.hipBall.position.copy(_hipW);
  leg.userData.ankle.position.set(_pedW.x - 0.030, _pedW.y + 0.030, leg.userData.z);
  leg.userData.foot.position.set(_pedW.x, _pedW.y + 0.006, leg.userData.z);
}

function tick() {
  clock.update();
  const dt = Math.min(clock.getDelta(), 0.05);

  if (playing) crankAngle += dt * 2.4 * (speed === 0 ? 0 : Math.max(speed, 0.0001));

  const drive = playing ? Math.max(speed, 0) : 0;

  /* --- 轮子 --- */
  const wheelSpin = crankAngle * 2.55;
  wheelR.userData.spin.rotation.z = -wheelSpin;
  wheelF.userData.spin.rotation.z = -wheelSpin;
  crank.rotation.z = -crankAngle;

  /* --- 踏板世界坐标 --- */
  const applyArm = (arm, side) => {
    const a = side > 0 ? -crankAngle : -crankAngle + Math.PI;
    const px = bb.x + Math.cos(a) * CRANK_R;
    const py = bb.y + Math.sin(a) * CRANK_R;
    return new V3(px, py, 0);
  };
  const pe = applyArm(crank.userData.near, 1);
  const pf = applyArm(crank.userData.far, -1);
  pedalNear.copy(pe); pedalFar.copy(pf);

  /* --- 身体起伏 --- */
  const bob = Math.sin(crankAngle * 2) * 0.013;
  const sway = Math.sin(crankAngle) * 0.010;
  bird.position.set(-0.06 + sway * 0.4, bob, 0);

  bodyMesh.rotation.z = -0.16 + Math.sin(crankAngle * 2 + 0.4) * 0.012;
  head.rotation.z = Math.sin(crankAngle * 2 + 1.1) * 0.035;
  head.rotation.y = Math.sin(crankAngle * 0.5) * 0.06;
  head.position.y = 1.522 + bob * 0.6;

  tailGroup.rotation.x = Math.sin(crankAngle * 1.5 + 2.0) * 0.05;
  tailGroup.rotation.z = TAIL_TILT + Math.sin(crankAngle * 1.5) * 0.040;

  // 围巾尾巴：跟尾巴错开相位，不然全身一起摆像上了发条
  scarfTailG.rotation.z = Math.sin(crankAngle * 2.4 + 0.6) * 0.11;
  scarfTailG.rotation.x = Math.sin(crankAngle * 1.7 + 1.4) * 0.08;

  // 小旗：频率比围巾快，风里最轻的那一件
  pennantG.rotation.y = Math.sin(crankAngle * 5.3) * 0.20;
  pennantG.rotation.z = Math.sin(crankAngle * 7.1 + 0.8) * 0.10;

  wings.forEach((w, i) => {
    const s = i === 0 ? 1 : -1;
    w.rotation.z = 0.20 + Math.sin(crankAngle * 2 + 0.9) * 0.030;
    w.rotation.x = -s * 0.36 + Math.sin(crankAngle * 1.6) * 0.018;
  });

  /* --- 腿 --- */
  updateLeg(legNear, pe);
  updateLeg(legFar,  pf);

  /* --- 眨眼 --- */
  blinkT -= dt;
  let eyeScale = 1;
  if (blinkT < 0.10) eyeScale = Math.max(0.10, blinkT / 0.10);
  if (blinkT < 0) blinkT = 3.4 + Math.random() * 2.6;
  eyes.forEach(e => { e.scale.y = eyeScale; });

  /* --- 沿赛道跑 --- */
  const v = 3.15 * drive;
  trackT = (trackT + dt * v / trackLen) % 1;
  track.getPointAt(trackT, _tp);
  track.getTangentAt(trackT, _tt);
  _tt.y = 0; _tt.normalize();

  // 车头朝局部 +x，所以世界朝向要把 +x 转到切线
  const yaw = Math.atan2(-_tt.z, _tt.x);
  _yawQ.setFromAxisAngle(UP, yaw);
  rig.position.set(_tp.x, 0, _tp.z);
  rig.quaternion.copy(_yawQ);

  // 弯道里压车：提前一点点看切线怎么转
  track.getTangentAt((trackT + 0.010) % 1, _tt2);
  _tt2.y = 0; _tt2.normalize();
  const turn = _tt.x * _tt2.z - _tt.z * _tt2.x;      // 有符号的转弯量
  const leanTarget = clamp(turn * 30, -0.30, 0.30) * Math.min(1, drive * 1.4);
  lean += (leanTarget - lean) * Math.min(1, dt * 5.5);
  rig.rotateX(lean);

  // 影子跟着车走，不然跑远了太阳照不到
  sun.position.set(_tp.x + sunDir.x, sunDir.y, _tp.z + sunDir.z);
  sun.target.position.set(_tp.x, 0.85, _tp.z);
  sun.target.updateMatrixWorld();
  contactSh.position.set(_tp.x, 0.008, _tp.z);
  contactSh.rotation.z = -yaw;

  /* --- 天上的鸟：绕着赛道打转 --- */
  const el = clock.getElapsed();
  skyBirds.forEach((b, i) => {
    const a = el * (0.06 + i * 0.008) + i * 1.3;
    const r = 15 + i * 2.4;
    b.position.set(Math.cos(a) * r, 4.6 + i * 0.9 + Math.sin(el * 0.7 + i) * 0.45,
                   Math.sin(a) * r);
    b.rotation.y = -a - Math.PI / 2;
  });

  /* --- 电影镜头 --- */
  if (cine) {
    const cur = SHOTS[shotKey];
    shotT += dt;
    if (shotT > cur.dur) {
      shotT = 0;
      shotKey = SHOT_ORDER[(SHOT_ORDER.indexOf(shotKey) + 1) % SHOT_ORDER.length];
      document.querySelectorAll('#camRow button[data-cam]').forEach(x =>
        x.classList.toggle('on', x.dataset.cam === shotKey));
    }
    const a = SHOTS[shotKey];
    const b = SHOTS[SHOT_ORDER[(SHOT_ORDER.indexOf(shotKey) + 1) % SHOT_ORDER.length]];
    // 镜头末段 1.6 秒平滑推到下一机位
    const k = clamp((shotT - (a.dur - 1.6)) / 1.6, 0, 1);
    const w = k * k * (3 - 2 * k);
    // 一点手持的漂移，镜头才不像钉在轨道上
    const dx = Math.sin(el * 0.47) * 0.055 + Math.sin(el * 1.13) * 0.018;
    const dy = Math.sin(el * 0.61 + 1.2) * 0.045;

    for (let i = 0; i < 3; i++) _off[i] = lerp(a.off[i], b.off[i], w);
    for (let i = 0; i < 3; i++) _lk[i] = lerp(a.look[i], b.look[i], w);
    _off[0] += dx; _off[1] += dy;

    // 在"车的坐标系里"做平滑，车跑多快镜头都不会拖在后面
    const ease = Math.min(1, dt * 8);
    for (let i = 0; i < 3; i++) {
      _smOff[i] += (_off[i] - _smOff[i]) * ease;
      _smLk[i]  += (_lk[i]  - _smLk[i])  * ease;
    }
    _tmpV.set(_smOff[0], _smOff[1], _smOff[2]).applyQuaternion(_yawQ).add(rig.position);
    camera.position.copy(_tmpV);
    _tmpV.set(_smLk[0], _smLk[1], _smLk[2]).applyQuaternion(_yawQ).add(rig.position);
    controls.target.copy(_tmpV);
    camera.lookAt(controls.target);
  } else {
    controls.update();
  }

  renderer.render(scene, camera);
}

/* ============================================================
   启动
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(tick);
window.__p3d = {
  scene, camera, renderer, controls, THREE, bird, bike, rig, track,
  setShot: k => { shotKey = k; shotT = 0; },
  setCine: v => { cine = v; controls.enabled = !v; },
  get shot() { return shotKey; },
};

requestAnimationFrame(() => {
  document.getElementById('loading').classList.add('gone');
  setTimeout(() => document.getElementById('hint').classList.add('fade'), 5200);
});
</script>
